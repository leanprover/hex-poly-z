name = "hex-poly-z-conformance"
defaultTargets = ["HexPolyZConformance", "hexpolyz_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyZ"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "85ab4582fbe0d86bb38f5429b17b9154fede75f0"

[[lean_lib]]
name = "HexPolyZConformance"
globs = ["HexPolyZ.Conformance"]

[[lean_exe]]
name = "hexpolyz_emit_fixtures"
root = "HexPolyZ.EmitFixtures"
